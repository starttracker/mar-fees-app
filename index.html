<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAR Fees Calculator</title>

<!-- ===== mini-stylesheet (same look-and-feel as the IFTZ version) ===== -->
<style>
    :root{
        --marine-blue:#114b8b;
        --border:#d7dde7;
    }
    *{box-sizing:border-box;font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
    body{
        margin:0;
        background:#f5f9ff;
        height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
    }
    .box{
        width:440px;
        max-width:92vw;
        background:#fff;
        border-radius:4px;
        box-shadow:0 4px 18px rgba(0,0,0,.15);
        text-align:center;
    }
    .box-header{
        background:var(--marine-blue);
        color:#fff;
        padding:18px 0;
        font-size:1.35rem;
        font-weight:600;
        border-top-left-radius:4px;
        border-top-right-radius:4px;
    }
    .box-body{
        padding:30px 40px 44px;
    }
    label{display:block;margin-bottom:10px;font-size:1.05rem}
    input[type="number"],
    input[readonly]{
        width:100%;
        padding:10px 14px;
        font-size:1rem;
        border:2px solid var(--border);
        border-radius:3px;
    }
    input[readonly]{background:#eceeef;margin-top:6px;color:#333}
    p{margin:28px 0 8px;font-size:1.05rem}
    button{
        margin-top:34px;
        padding:10px 44px;
        font-size:1rem;
        font-weight:700;
        background:#f3f4f7;
        border:2px solid var(--border);
        border-radius:4px;
        cursor:pointer;
        transition:background .2s;
    }
    button:hover{background:#e6e8ee}
</style>
</head>

<body>
<div class="box">
    <div class="box-header">MAR Fees Calculator</div>

    <div class="box-body">
        <label for="nt">Please insert the vessel's Net Tonnage:</label>
        <input type="number" id="nt" placeholder="e.g. 12 750" min="0" step="any" autocomplete="off">

        <p>This vessel would pay a registration fee&nbsp;of:</p>
        <input type="text" id="regFee" readonly placeholder="—">

        <p style="margin-top:40px">and an annual fee&nbsp;of:</p>
        <input type="text" id="annualFee" readonly placeholder="—">

        <button id="reset">RESET</button>
    </div>
</div>

<!-- ===== computation logic ===== -->
<script>
/* -------------------- fee tables (screenshot #4) -------------------- */
// Registration: fixed €1 800 + variable scale
const regFixed = 1800;
const regScale = [
  {limit:   250,  flat:225, rate:0},            // first slice = €225 flat
  {limit:  2500,  flat:0,   rate:0.90},         // 250 → 2 500
  {limit: 10000,  flat:0,   rate:0.70},         // 2 500 → 10 000
  {limit: 20000,  flat:0,   rate:0.50},         // 10 000 → 20 000
  {limit: 30000,  flat:0,   rate:0.30},         // 20 000 → 30 000
  {limit: Infinity, flat:0, rate:0.10}          // above 30 000
];

// Annual: fixed €1 400 + variable scale
const annualFixed = 1400;
const annualScale = [
  {limit:   250,  flat:200, rate:0},
  {limit:  2500,  flat:0,   rate:0.80},
  {limit: 20000,  flat:0,   rate:0.40},
  {limit: Infinity, flat:0, rate:0.25}
];

/**
 * Generic “progressive scale” calculator.
 * @param {number} nt   – Net tonnage supplied by user
 * @param {Array}  tbl  – Array of {limit, flat, rate}
 * @param {number} base – Fixed part that’s always charged
 * @returns {number}    – Total fee (fixed + variable)
 */
function calcFee(nt, tbl, base){
  let fee = base;
  let lower = 0;

  for (const {limit, flat, rate} of tbl){
    if (nt <= lower) break;

    if (flat){               // flat charge for first slice
      fee += flat;
    } else {                 // per-ton rate slice
      const span = Math.min(nt, limit) - lower;
      fee += span * rate;
    }
    lower = limit;
  }
  return fee;
}

/* -------------------- DOM glue -------------------- */
const ntInput     = document.getElementById('nt');
const regOut      = document.getElementById('regFee');
const annualOut   = document.getElementById('annualFee');
const resetBtn    = document.getElementById('reset');

ntInput.addEventListener('input', () => {
  const nt = parseFloat(ntInput.value);
  if (isNaN(nt) || nt <= 0){
    regOut.value = annualOut.value = '';
    return;
  }
  const registration = calcFee(nt, regScale, regFixed);
  const annual       = calcFee(nt, annualScale, annualFixed);

  const fmt = v => v.toLocaleString('en-US',{
                    style:'currency',currency:'EUR',
                    minimumFractionDigits:2,maximumFractionDigits:2});
  regOut.value    = fmt(registration);
  annualOut.value = fmt(annual);
});

resetBtn.addEventListener('click',()=>{
  ntInput.value='';
  regOut.value=annualOut.value='';
  ntInput.focus();
});
</script>
</body>
</html>
